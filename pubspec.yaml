name: beyond_tv_workspace
description: Raiz do workspace do Beyond TV (não é publicado).
publish_to: none

environment:
  sdk: ^3.6.0

# Cada pacote listado aqui declara `resolution: workspace` no próprio pubspec.
workspace:
  - apps/dashboard
  - apps/server
  - apps/tv
  - packages/beyond_protocol

dev_dependencies:
  flutter_lints: ^6.0.0
